services:
  - type: web
    name: ha-andreou-law
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # the website's data (SQLite file) is kept on this disk, so it survives restarts and deploys
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SQLITE_PATH
        value: /var/data/andreou.db
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPPORT_USERNAME
        value: ergonsite
      - key: SUPPORT_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
